name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck:
    name: tsc + vitest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsc --noEmit
      # Two hook rules only (see eslint.config.js). rules-of-hooks is an error;
      # exhaustive-deps warns against a RATCHET: the count may fall, never rise.
      # Rust has had clippy -D warnings for ages; 43.5k lines of TypeScript had
      # nothing, which is how 33 unreviewed dependency arrays accumulated in the
      # camera and co-review paths.
      - run: npm run lint
      - run: npx vitest run

  cargo-check:
    name: cargo check (src-tauri)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The Tauri build script validates that every externalBin entry
      # in tauri.conf.json exists on disk. Sidecar binaries are not in
      # git (devs run `npm run setup`), so stub them as zero-byte files
      # just to get past the resource-path check.
      - name: Stub sidecars so cargo check passes
        run: |
          mkdir -p src-tauri/binaries
          for name in yt-dlp ffmpeg ffprobe whisper-cli saucebunny-diarize saucebunny-dictate saucebunny-capture llama-server; do
            touch "src-tauri/binaries/${name}-aarch64-apple-darwin"
            chmod +x "src-tauri/binaries/${name}-aarch64-apple-darwin"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: cargo check
        working-directory: src-tauri
      # Unit tests (proxy parsing, error truncation) + the ts-rs binding
      # exports, which double as a stale-bindings check.
      - run: cargo test --lib
        working-directory: src-tauri
      # Zero-warning policy — the codebase is clippy-clean as of r86.
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri

  swift-build:
    name: swift build (diarizer)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release --arch arm64
        working-directory: swift-sidecar

  ui-smoke:
    name: ui smoke (playwright)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      # Drives the Vite-served frontend in Chromium with Tauri IPC mocked
      # (e2e/tauri-mock.ts) — tauri-driver has no macOS support, so this is
      # the shell-level smoke: boots, chrome wired, no pageerrors.
      - run: npx playwright install chromium
      - run: npx playwright test
