name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck:
    name: tsc + vitest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsc --noEmit
      # Two hook rules only (see eslint.config.js). rules-of-hooks is an error;
      # exhaustive-deps warns against a RATCHET: the count may fall, never rise.
      # Rust has had clippy -D warnings for ages; 43.5k lines of TypeScript had
      # nothing, which is how 33 unreviewed dependency arrays accumulated in the
      # camera and co-review paths.
      # The ratchet is now at ZERO. Every remaining exception is an inline
      # disable naming the ref that makes it safe, so a new warning is a new
      # dependency array nobody has read — not one of the old ones resurfacing.
      - run: npm run lint
      - run: npx vitest run

  cargo-check:
    name: cargo check (src-tauri)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # The Tauri build script validates that every externalBin entry
      # in tauri.conf.json exists on disk. Sidecar binaries are not in
      # git (devs run `npm run setup`), so stub them as zero-byte files
      # just to get past the resource-path check.
      - name: Stub sidecars so cargo check passes
        run: |
          mkdir -p src-tauri/binaries
          for name in yt-dlp ffmpeg ffprobe whisper-cli saucebunny-diarize saucebunny-dictate saucebunny-capture llama-server; do
            touch "src-tauri/binaries/${name}-aarch64-apple-darwin"
            chmod +x "src-tauri/binaries/${name}-aarch64-apple-darwin"
          done
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npm ci
      - run: cargo check
        working-directory: src-tauri
      # Unit tests (proxy parsing, error truncation) + the ts-rs binding
      # exports, which double as a stale-bindings check.
      - run: cargo test --lib
        working-directory: src-tauri
      # Zero-warning policy — the codebase is clippy-clean as of r86.
      # --all-targets is load-bearing, not tidiness. Without it clippy lints
      # the lib and the bin and stops; the ~264 unit tests live in
      # `#[cfg(test)]` modules that are only compiled for the TEST targets, so
      # they were never linted at all. Verified by planting a `v.len() == 0`
      # in one of those modules: the bare `cargo clippy -- -D warnings` above
      # passed it silently, and --all-targets rejected it as len_zero. The
      # tree is already clean under the wider flag, so this locks in a
      # standard the test code was meeting only by luck.
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  swift-build:
    name: swift build (diarizer)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: swift build -c release --arch arm64
        working-directory: swift-sidecar

  ui-smoke:
    name: ui smoke (playwright)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npm ci
      # Drives the Vite-served frontend in Chromium with Tauri IPC mocked
      # (e2e/tauri-mock.ts) — tauri-driver has no macOS support, so this is
      # the shell-level smoke: boots, chrome wired, no pageerrors.
      - run: npx playwright install chromium
      - run: npx playwright test

  # ── The artifact, not just the source ────────────────────────────────
  #
  # Every job above checks SOURCE. Nothing looked at what actually ships, and
  # three real defects walked through that gap: a CSP baked into the binary
  # that forbade WebAssembly (audio silent in the .dmg, fine in `tauri dev`,
  # three user reports to find), a resource map that collapsed three license
  # files into one so the MIT LICENSE and the GPLv3 text never shipped, and a
  # DMG step that failed while the .app it had produced was fine.
  #
  # This job builds the real bundle and asserts those properties. Sidecars are
  # STUBBED (they are not in git; two are compiled from source and far too slow
  # for CI), so verify-bundle.sh's non-stub sidecar checks are expected to fail
  # here — hence `--allow-stub-sidecars`. What CI proves is the part that broke:
  # the release-profile Rust build compiles, the bundle is produced, the CSP and
  # asset scope are baked in correctly, the licenses land as separate files, and
  # Info.plist carries the keys the app needs at runtime.
  #
  # Runtime ~12-18 min cold, ~6-8 warm. Signing and notarization need
  # credentials this project does not have; that stays a local step.
  bundle:
    name: Build + verify the app bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Same stubbing the cargo job uses: real binaries are gitignored.
      - name: Stub sidecars
        run: |
          mkdir -p src-tauri/binaries
          for n in yt-dlp ffmpeg ffprobe whisper-cli llama-server \
                   saucebunny-diarize saucebunny-dictate saucebunny-capture; do
            : > "src-tauri/binaries/${n}-aarch64-apple-darwin"
            chmod +x "src-tauri/binaries/${n}-aarch64-apple-darwin"
          done
      - name: Build the bundle
        run: npm run tauri build -- --bundles app
      - name: Verify the bundle
        run: bash scripts/verify-bundle.sh --allow-stub-sidecars
