[package]
name = "sauce-bunny"
version = "0.4.8"
description = "Sauce Bunny — local-first transcription + diarization"
authors = ["Sauce Bunny contributors"]
edition = "2021"
# iroh and its family declare 1.91; this said 1.77.2 and was the number
# README and CONTRIBUTING were both quoting, so a contributor on a
# toolchain the project cannot build was told they were fine.
rust-version = "1.91"

[lib]
name = "sauce_bunny_lib"
# Desktop-macOS only (see tauri.conf.json `bundle.targets = ["app", "dmg"]`).
# `rlib` is what `cargo run` / `tauri dev` link against. The previous
# ["staticlib", "cdylib", "rlib"] triple caused rustc to fail the bin link
# step with `crate tauri required to be available in rlib format` once
# cargo's incremental cache was purged. Re-add cdylib/staticlib only if/when
# we target iOS / Android / Windows.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
# Native camera/mic TCC status (WKWebView's JS Permissions query is
# unreliable for capture, so the app can't otherwise tell "granted" from
# "denied" - AVCaptureDevice.authorizationStatus is the real answer).
objc2 = "0.6"
# NSFileManager for trashItemAtURL: moving a file to the Finder Trash rather
# than unlinking it. The app has no undo and no trash of its own, so the OS's
# is the recovery path - a delete you can take back is a different feature
# from one you cannot. No new crate: objc2-foundation was already here.
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSString", "NSError"] }
# NSPasteboard, for read_clipboard_text. Already in the tree via muda/tao/tauri
# (see `cargo tree -i objc2-app-kit`), so naming it directly adds no crate - it
# only makes a dependency the app already compiles usable from our own code.
# This replaced tauri-plugin-clipboard-manager, which pulled arboard and, with
# it, an entire image stack (image, tiff, zune-jpeg, moxcms, fax, weezl...) to
# support a clipboard write-image the app has never called.
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
# Finder tags. macOS stores them as com.apple.metadata:_kMDItemUserTags, a
# BINARY plist of "Name\nColourIndex" strings, so reading or writing them needs
# both an xattr accessor and a plist codec. Both crates are tiny and MIT/Apache.
# Using the real xattr (rather than a private colour store) is what makes a
# colour set here show up in Finder, and a colour set in Finder show up here.
xattr = "1"
plist = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
# `blocking` feature powers the localhost media proxy's thread-per-request
# handler (r58) — reqwest's blocking client must run OUTSIDE a tokio
# runtime, which the tiny_http worker threads satisfy. The async client
# (default) is still used by download.rs / transcript.rs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
# yt-dlp updater integrity: verify the release's SHA2-256SUMS entry before the
# downloaded binary is made executable. (MIT OR Apache-2.0, RustCrypto.)
sha2 = "0.10"
# Tauri reports protocol and scope failures through the `log` facade - notably
# "asset protocol not configured to allow the path: …", which answers with 403
# and an EMPTY body. With no logger installed those records were DROPPED, so a
# denied read showed up only as a black video or a broken thumbnail: the same
# silent shape as the r150 CSP bug. lib.rs installs a stderr logger so the
# message survives. Already in Cargo.lock as a transitive dep of tauri, so this
# adds no new crate. MIT OR Apache-2.0.
log = "0.4"
# Tier C transfer verification. Already in the lock file as a transitive dep
# of the iroh stack, so this adds zero new crates. MIT OR Apache-2.0.
# mmap + rayon: update_mmap_rayon hashes a multi-GB offer memory-bandwidth
# bound across every core instead of one core through a 64 KiB read loop -
# measured 3-5x on the files people actually screen (b3sum ships this way).
blake3 = { version = "1", features = ["mmap", "rayon"] }
# Already in the graph via quinn/iroh; named so the Tier B bridge can pass
# the transport's own zero-copy buffers instead of re-allocating per chunk.
bytes = "1"
# Cloud AI (opt-in Claude/ChatGPT): the user's API key lives in the macOS
# Keychain, never plaintext localStorage and never in the webview. keyring 2.x
# ships the Apple keystore in its default features.
keyring = "2"
# r58: localhost HTTP media proxy. WKWebView's media engine refuses to
# issue requests for <video src="custom-scheme://"> (verified empirically
# in r57 — the custom URI scheme handler was never invoked). It WILL
# stream from a real http(s) URL. So we run a tiny loopback HTTP server
# (127.0.0.1, random port, never exposed off-machine) that proxies the
# yt-dlp-resolved CDN URL with full header control + forwarded Range
# requests. This is the mpv/VLC pattern. `base64` decodes the upstream
# URL the frontend packs into the request path.
tiny_http = "0.12"
base64 = "0.22"
# Single source of truth for cross-boundary types (r49). The `#[derive(TS)]`
# macro expansion is compile-time only and the `export()` machinery is
# `#[cfg(test)]`-gated, so the runtime binary carries no ts-rs code.
# Run `cargo test` to refresh `src/bindings/*.ts`.
ts-rs = "10"
# r100: P2P co-review ("watch party") — commands/session.rs. iroh gives us
# QUIC dialed by endpoint public key (hole-punching, E2E encryption) with
# n0 public discovery + relays as connect-assist; iroh-tickets mints the
# shareable join code. Like stream_proxy.rs this is a media-adjacent collab
# PRIMITIVE, not an app backend: no media transits peers, relays only carry
# E2E-encrypted control JSON. Heavy dep tree — accepted (r100 decision).
# Both MIT/Apache-2.0. A relay-URL setting + LAN-only mode is Phase 3.
iroh = "1"
iroh-tickets = "1"

[profile.release]
# NOT panic = "abort" (r151). Aborting saves a little binary size and buys
# nothing this app wants: it turns a panic in ONE worker into the whole
# application vanishing, and this design leans hard on isolation - a
# thread-per-request media proxy, a task per peer connection, a task per
# transcription job - precisely so that one failure cannot take the user's
# session, their unsaved review notes and their in-flight export with it.
# Unwinding also lets the RAII guards this codebase uses for concurrency
# limits and registry cleanup actually run. Panics in a tokio task are
# confined to that task; panics in a std thread kill that thread only.
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
# Only the library-scanner tests, for unique temp dirs. Production job ids are
# minted in the renderer (src/lib/job-id.ts), so nothing here needs a UUID.
uuid = { version = "1", features = ["v4"] }
